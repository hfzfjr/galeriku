# Galeriku — Compose untuk Coolify (resource Docker Compose dari Git).
# Base Directory "/infrastructure", Docker Compose Location "/docker-compose.yml".
# Variabel diisi di UI Coolify (bukan infrastructure/.env).
# Compose ini hanya service backend; database PostgreSQL 16 adalah
# resource Database Coolify terpisah. Backend menjangkau database lewat
# DATABASE_URL (Internal URL resource database, diisi di UI Coolify).
# TIDAK ada service cloudflared: tunnel "cf-tunnel" jalan sebagai layanan
# host dengan route galeriku-api.hafizfajar.com -> http://localhost:80
# (proxy Coolify/Traefik; didaftarkan manual lewat dashboard Cloudflare).
# Tanpa container_name (Coolify mengelola nama sendiri agar tidak bentrok
# dengan container lama) dan tanpa ports pada backend (akses lewat proxy
# Coolify). Variabel wajib memakai ${VAR:?} supaya deploy diblokir bila
# kosong, kecuali DATABASE_URL yang ditulis ${DATABASE_URL} tanpa :?
# karena validator Coolify menolaknya di posisi itu.
name: galeriku

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: galeriku-backend:latest
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PORT: "4000"
      HOST: 0.0.0.0
      NODE_ENV: production
      # DATABASE_URL diisi dari Internal URL resource Database Coolify.
      # Sengaja tanpa :? karena validator Coolify menolaknya di posisi ini.
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES:?}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:?}
      MAIL_API_KEY: ${MAIL_API_KEY:?}
      MAIL_FROM: ${MAIL_FROM:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:?}
      MEDIA_DIR: /data/media
    volumes:
      # MEDIA_HOST_DIR harus path absolut di host, sudah dibuat dan dimiliki
      # uid 1000 SEBELUM deploy. Sengaja tanpa :? karena validator
      # Coolify menolaknya pada sumber volume.
      - ${MEDIA_HOST_DIR}:/data/media
    # Database adalah resource terpisah; backend perlu jaringan "coolify"
    # untuk menjangkaunya di samping jaringan default compose. Jika Coolify
    # mengatur ini lewat opsi "Connect to Predefined Network", opsi itu juga
    # harus aktif (belum diverifikasi di environment ini).
    networks:
      - default
      - coolify
    healthcheck:
      # Image slim tanpa curl/wget; pakai fetch bawaan Node.
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:4000/health\").then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  coolify:
    external: true
