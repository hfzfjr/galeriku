# Galeriku — Compose untuk Coolify (resource Docker Compose dari Git).
# Base Directory "/infrastructure", Docker Compose Location "/docker-compose.yml".
# Variabel diisi di UI Coolify (bukan infrastructure/.env).
# TIDAK ada service cloudflared: tunnel "cf-tunnel" jalan sebagai layanan
# host dengan route galeriku-api.hafizfajar.com -> http://localhost:80
# (proxy Coolify/Traefik; didaftarkan manual lewat dashboard Cloudflare).
# Tanpa container_name (Coolify mengelola nama sendiri agar tidak bentrok
# dengan container lama) dan tanpa ports pada backend (akses lewat proxy
# Coolify). Variabel wajib memakai ${VAR:?} supaya deploy diblokir bila
# kosong. postgres tetap tanpa publish port.
name: galeriku

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - galeriku_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: galeriku-backend:latest
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PORT: "4000"
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES:?}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:?}
      MAIL_API_KEY: ${MAIL_API_KEY:?}
      MAIL_FROM: ${MAIL_FROM:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:?}
      MEDIA_DIR: /data/media
    volumes:
      # MEDIA_HOST_DIR harus path absolut di host, sudah dibuat dan dimiliki
      # uid 1000 SEBELUM deploy. Sengaja tanpa :? karena validator
      # Coolify menolaknya pada sumber volume.
      - ${MEDIA_HOST_DIR}:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Image slim tanpa curl/wget; pakai fetch bawaan Node.
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:4000/health\").then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  galeriku_pgdata:
