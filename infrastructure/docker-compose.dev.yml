# Override OPSIONAL untuk laptop: hanya mempublish postgres ke loopback
# agar bisa diakses tool lokal (psql, Prisma Studio).
# Dipakai eksplisit dengan -f, TIDAK auto-load (bukan override.yml):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Jangan dipakai di server.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
